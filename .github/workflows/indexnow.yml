name: IndexNow on changed URLs

on:
  push:
    branches:
      - main
    paths:
      - "src/data/sites/side-sleeper/**"
      - "src/app/**/page.tsx"
      - "src/app/**/layout.tsx"
      - "src/lib/sitemap.ts"
      - "src/lib/indexnow.ts"
      - "src/lib/site.ts"
      - "src/lib/paths.ts"
      - "src/lib/about.ts"
      - "src/lib/privacy-policy.ts"
      - "src/lib/research-score.ts"
      - "scripts/indexnow-on-push.ts"
      - "scripts/list-indexnow-urls.ts"

jobs:
  submit-changed-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Submit added, updated, and deleted sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: npx tsx scripts/indexnow-on-push.ts
