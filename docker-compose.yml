services:
  postgres:
    image: postgres:16-alpine
    container_name: directory-cms-postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: directory
      POSTGRES_PASSWORD: directory
      POSTGRES_DB: directory_cms
    volumes:
      - directory_cms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directory -d directory_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  directory_cms_pgdata:
